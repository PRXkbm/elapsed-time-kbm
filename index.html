<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지난 시간</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0b0b0f;
    color: #fff;
    font-family: Arial, "Noto Sans KR", sans-serif;
  }
  .box {
    text-align: center;
    padding: 40px;
  }
  .label {
    color: #999;
    font-size: 18px;
    margin-top: 24px;
  }
  .start {
    font-size: 28px;
    font-weight: 700;
    margin-top: 8px;
  }
  .elapsed {
    font-size: 48px;
    font-weight: 800;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="label">시작된 시간</div>
    <div class="start">2026년 10월 3일 오후 1:30</div>

    <div class="label">지난 시간</div>
    <div class="elapsed" id="elapsed">계산 중...</div>
  </div>

<script>
const startTime = new Date(2026, 9, 3, 13, 30, 0);

function updateElapsed() {
  const now = new Date();
  let diff = Math.max(0, now - startTime);

  const totalMinutes = Math.floor(diff / 60000);
  const days = Math.floor(totalMinutes / 1440);
  const hours = Math.floor((totalMinutes % 1440) / 60);
  const minutes = totalMinutes % 60;

  document.getElementById("elapsed").textContent =
    `${days}일 ${hours}시간 ${minutes}분`;
}

updateElapsed();
setInterval(updateElapsed, 1000);
</script>
</body>
</html>
